<p>基于Android系统，使用OpenGL2.0、C++语言编写。为了在手Q里展示类似游戏一样的较为炫酷的3D效果，进行了技术预研，利用OpenGL+Assimp实现了3D模型的渲染、骨骼动画，并预研了光照、阴影等效果的实现。积累了矩阵变换、3D编程、OpenGL等相关知识。项目代码在公司内网未公开。</p>
